services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dyingstar
      POSTGRES_USER: dyingstar
      POSTGRES_PASSWORD: dyingstar_dev
    ports:
      - "5432:5432"
    volumes:
      - dyingstar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dyingstar -d dyingstar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dyingstar_redis:/data

volumes:
  dyingstar_postgres:
  dyingstar_redis:
